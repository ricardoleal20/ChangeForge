[package]
name = "releaseweave"
version = "0.1.5"
edition = "2021"

description = "Changeset-driven releases for single repositories and monorepos, built for GitHub"
license = "MIT"
repository = "https://github.com/ricardoleal20/ChangeForge"
readme = "README.md"
default-run = "releaseweave"

[[bin]]
name = "releaseweave"
path = "src/main.rs"

[[bin]]
name = "changeforge"
path = "src/compat.rs"

[dependencies]
anyhow = "1.0"
glob = "0.3"
clap = { version = "4.5.1", features = ["derive"] }
toml = "0.8.11"
serde = { version = ">=1.0", features = ["derive"] }
serde_json = "1.0.114"
semver = { version = "1.0", features = ["serde"] }
toml_edit = "0.22"
inquire = "0.9"
tempfile = "3.10.1"
