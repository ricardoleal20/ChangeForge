name: Rust quality and PoC
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: GitHub publisher regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build release binary
        run: cargo build --release --locked
      - name: Run both PoC scenarios
        run: python3 scripts/demo.py
      - name: Build documentation
        run: python3 docs/docs_build.py build
      - name: Upload reproducible demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: releaseweave-poc
          path: .demo/
          include-hidden-files: true
  compatibility:
    name: compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test CLI
        run: cargo test --all-targets --locked
